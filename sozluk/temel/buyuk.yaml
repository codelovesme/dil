  bicimler:
    kir: çoñ
    uig: çoñ
- kok: zur
  koken: belirsiz
  kaynak: savelyev-turkic
  not: Tatarca ve Başkurtça zur; kökeni tartışmalı (Farsça zūr 'güç' ile ilişkilendirilir).
  bicimler:
    bak: zur
    tat: zur
- kok: katta
  koken: belirsiz
