kavram: sen
ingilizce: you (singular)
anlam: İkinci tekil şahıs zamiri; konuşulan kişi.
dogrulandi: false
kokler:
  - kok: sen
    koken: türkçe
    ana_turkce: "*se (*sän)"
    kaynak: >-
      Wiktionary, Reconstruction:Proto-Turkic/se (Clauson 1972 s. 831). Ortak Türkçe
      *sän, eğik durum gövdesi *sän- üzerinden geriye oluşum (krş. *be > ben).
    not: >-
      Düzenli ses denklikleri: Başkurtça s- > h- (hin), Sahaca ve Dolganca s- düşer
      (en), Çuvaşçada başa e- gelir (esĕ). Wiktionary'de olmayan Kerkük, Balkan
      Gagavuz ve Türkiye ağızları genel Türkoloji bilgisine dayanır. Sarı Uygurca,
      Çulımca, Duhaca, Soyotça boş bırakıldı.
    tarihi:
      otk: sän            # Orhon 𐰾𐰤; Eski Uygurca sän
      xqa: sen
      eski-anadolu: sän
      qwm: sen            # Codex Cumanicus
      chg: sän
