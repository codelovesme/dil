# Sözlük maddesi (Hedef 4) — bkz. ILKELER.md §14, şablon: .claude/skills/kelime-arastir/kok-sablon.yaml
# Okunur sayfa bu dosyadan üretilir: python3 araclar/sozluk.py --yaz
kok: ben
anlam: birinci tekil şahıs zamiri ("ben")
koken: türkçe
ana_turkce: "*bẹ, eğik gövde *bẹn-"
kavramlar: [ben]
etimoloji: >-
  Ortak Türkçe *ben, eğik durum gövdesi *bẹn- (zamir -n'si) üzerinden geriye oluşumdur
  (Róna-Tas 1999). Moğolca ve Tunguzca *bi ile karşılaştırılır. Yönelme durumu her
  dönemde kalın ünlülüdür (baŋa, maŋa). Başta b- > m- değişimi (genizsil ünsüzden önce)
  çok erken başlamıştır; Oğuz dışındaki dillerde men/min olmuştur. Çuvaşça epĕ
  b-'nin düştüğü ayrı bir gelişmedir.
kaynak: wiktionary-ana-turkce; clauson

