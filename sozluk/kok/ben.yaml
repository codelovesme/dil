    yer: Orhon, Moğolistan
    yuzyil: 8
    bicim: bän
    yazi: 𐰋𐰤
    metin: Kül Tigin, Bilge Kağan ve Tonyukuk yazıtları
    kaynak: clauson
    atif: s. 346
    not: Göktürk yazıtlarında yaygın biçim; Tonyukuk'ta tek biçim bän. Eğik durumlar bäni, bäniŋ, baŋa.
  - dil: otk
    yer: Moğolistan
    yuzyil: 8
    bicim: män
    metin: Irk Bitig ve bazı küçük yazıtlar
    kaynak: clauson
    atif: s. 346
    not: Göktürk döneminde m-'li biçim de görülür; ayrım yazıtlar arasında ölçüt sayılır.
  - dil: otk
