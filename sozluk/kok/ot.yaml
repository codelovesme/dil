# Sözlük maddesi (Hedef 4) — bkz. ILKELER.md §14
kok: ot
anlam: '"ateş"'
koken: türkçe
ana_turkce: '*ōt'
kavramlar:
- ates
etimoloji: 'Ana Türkçe *ōt (uzun o: Türkmence oot, Sahaca uot, Halaçça huot). Neredeyse bütün
  dillerde ''ateş''; Türkiye Türkçesinde Farsça ateş''e yerini bırakmış, od ve ocak''ta yaşar.
  Çuvaşça vut.'
