# Sözlük maddesi (Hedef 4) — bkz. ILKELER.md §14
kok: ür
anlam: '"üflemek"'
koken: türkçe
ana_turkce: '*ür-'
kavramlar:
- ufle
etimoloji: Ana Türkçe *ür- 'üflemek'. Eski Türkçe ve Sibirya dillerinde, Karaçay-Malkarcada;
  Kazakça ürle-; Çuvaşça vĕr- (ön ses v- ile).
kaynak: savelyev-turkic

