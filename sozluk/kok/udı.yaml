etimoloji: Ana Türkçe *udï-; Eski Türkçe udı-. -d- dillere göre y (uyu-), z (uzu-, Hakas,
  Şor, Çulım, Sarı Uygur), d (udu-, Sayan), t (utuy-, Saha) olur. Birçok dilde uyku adından
  türeyen uykıla-/ukla-/yukla- 'uyumak' asıl fiil olmuştur; aynı kökte toplandı.
kaynak: savelyev-turkic; wiktionary-ana-turkce

