# Sözlük maddesi (Hedef 4) — bkz. ILKELER.md §14
kok: bul
anlam: '"bulmak"'
koken: türkçe
ana_turkce: '*bul-'
kavramlar:
- bul
etimoloji: >-
  Ana Türkçe *bul- 'bulmak'. Clauson'a göre eski dönemde (Göktürkçeden Çağataycaya) yaygın;
  bugün Türkiye, Gagauz, Halaç dillerinde ve Sahada asıl 'bulmak' fiili, öbür dillerde
  yerini tap- almış.
kaynak: savelyev-turkic

