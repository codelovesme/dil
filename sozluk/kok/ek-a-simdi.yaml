# Sözlük maddesi (Hedef 4) — bkz. ILKELER.md §14
kok: ek-a-simdi
anlam: '"şimdiki-geniş zaman eki -A"'
koken: türkçe
ana_turkce: '*-A'
kavramlar:
- simdiki-zaman
etimoloji: 'Zarf-fiil -A ile kişi eki: Kıpçak, Karluk ve Saha dillerinde şimdiki ve geniş
  zaman. Uygurcada a > i.'
kaynak: apertium; universal-dependencies; tatoeba

