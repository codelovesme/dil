etimoloji: Ana Türkçe *urug 'tohum; soy'; Eski Türkçe uruğ. Kıpçak'ta urluk, Kıpçak-Bulgar
  orlık, Kırgız uruk; Çuvaşça văra. Sayan dillerinde uruğ 'çocuk' anlamına kaymıştır (bkz.
  çocuk). Kök kimliği o kayıttan ayrılsın diye uruğ-tohum.
