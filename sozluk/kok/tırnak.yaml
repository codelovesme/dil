etimoloji: Ana Türkçe *tïrŋak. Bütün kollarda; Eski Uygurca tırñak/tıñrak, Sibirya'da tırğak,
  dırgak, Saha tıñırax, Çuvaşça çĕrne. Kırgız, Uygur, Altay tırmak biçimleri tarmak 'pençe'
  ile karışmış olabilir.
