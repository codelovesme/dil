# Sözlük maddesi (Hedef 4) — bkz. ILKELER.md §14
kok: ek-lar
anlam: '"çoğul eki -lAr"'
koken: türkçe
ana_turkce: '*-lAr'
kavramlar:
- cogul
etimoloji: Ana Türkçe *-lAr çoğul eki. Göktürkçeden beri (begler 'beyler'); bütün Ortak Türkçe
  dillerinde. Önceki sese göre l > n, d, t, z olur (Kıpçak, Sibirya); ünlüsü ünlü uyumuna
  uyar. Çuvaşçada yerini -sem almış.
