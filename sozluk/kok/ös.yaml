# Sözlük maddesi (Hedef 4) — bkz. ILKELER.md §14
kok: ös
anlam: '"büyümek"'
koken: türkçe
ana_turkce: '*ös-'
kavramlar:
- buyu
etimoloji: >-
  Ana Türkçe *ös- 'büyümek' olarak verilir. Kıpçak, Karluk, Kırgız, Sibirya ve Türkmen
  dillerinde (ös-, üs-, üz-); Çuvaşça üs-. Tartışmalı: Clauson bu fiili Moğolca ös-
  'büyümek' fiilinden ödünç sayar; Eski Uygurcadaki iki okumanın hatalı olduğunu,
  eski Türkçede tanıklanmadığını yazar. Çuvaşçada da bulunması ödünç görüşüne karşı
  bir kanıttır. Kesin karar verilmedi.
kaynak: savelyev-turkic

