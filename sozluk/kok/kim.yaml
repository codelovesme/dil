    bicim: kim
    metin: Memlük Kıpçakçası sözlükleri
    kaynak: clauson
    kaydeden: Memlük sözlükçüleri (Arapça)
    yabanci: true
    denetim: {durum: tek-kaynak, bicim: [clauson], anlam: [clauson]}
  - dil: chg
    yuzyil: 15-18
    bicim: kim
