    metin: Dîvânu Lugâti't-Türk
    kaynak: dlt; clauson
    atif: DLT I 338
    kaydeden: Kâşgarlı Mahmud
    denetim: {durum: tek-kaynak, bicim: [dlt, clauson], anlam: [dlt, clauson]}
  - dil: xqa
    yuzyil: 11-13
    bicim: kim
    metin: Kutadgu Bilig; Atebetü'l-Hakayık; Karahanlıca Kur'an tefsiri
    kaynak: clauson
    not: kayu kim 'her kim', kaçan kim 'ne zaman ki', kimse 'biri'.
    denetim: {durum: tek-kaynak, bicim: [clauson], anlam: [clauson]}
  - dil: xbo
    yuzyil: 13-14
    bicim: kem
    yazi: كم
    metin: Volga Bulgar mezar taşları
    kaynak: wiktionary-ana-turkce
    atif: "Erdal 1993 s. 69-70; Wiktionary Reconstruction:Proto-Turkic/käm; sayfanın kaynakları: clauson, estja, rasanen"
    denetim: {durum: tek-kaynak, bicim: [wiktionary-ana-turkce], anlam: [wiktionary-ana-turkce]}
  - dil: chg
    yer: Harezm
    yuzyil: 13-14
    bicim: kim
    metin: Harezm Türkçesi metinleri; Nehcü'l-Feradis
    kaynak: clauson
    not: kimerse, kimse, kimesne.
    denetim: {durum: tek-kaynak, bicim: [clauson], anlam: [clauson]}
  - dil: ortak
    yuzyil: 14
    bicim: kīm
    metin: İbn Mühennâ Lügati
    kaynak: ibn-muhenna; clauson
    kaydeden: İbn Mühennâ (Arapça sözlük)
    not: Soru ve ilgi zamiri olarak.
    denetim: {durum: tek-kaynak, bicim: [ibn-muhenna, clauson], anlam: [ibn-muhenna, clauson]}
  - dil: qwm
    yer: Kırım ve Deşt-i Kıpçak
    yuzyil: 14
    bicim: kim
    metin: Codex Cumanicus
    kaynak: gronbech-kuman; clauson; savelyev-turkic
    kaydeden: İtalyan tüccarlar ve Alman Fransisken misyonerler (Latin harfli)
    yabanci: true
    not: Yazmada kym ve kim yazımları.
    denetim: {durum: dogrulandi, bicim: [gronbech-kuman, clauson, savelyev-turkic], anlam: [gronbech-kuman, clauson, savelyev-turkic]}
  - dil: qwm
    yer: Memlük Mısır'ı
