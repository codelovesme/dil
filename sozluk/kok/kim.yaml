# Sözlük maddesi (Hedef 4) — bkz. ILKELER.md §14
kok: kim
anlam: kişiyi soran soru zamiri ("kim"); eski dilde ilgi zamiri ve bağlaç da
koken: türkçe
ana_turkce: '*kem'
kavramlar:
- kim
etimoloji: Ana Türkçe *kem, soru gövdesi *ka-'dan türemiştir (krş. kaç, kayu, kanı). Ortak
  Türkçede ünlü daralmış (kim), Kıpçak-Bulgar, Altay ve Yenisey dillerinde e korunmuş (kem);
  Çuvaşça kam, Volga Bulgarcası kem. Eski Türkçeden beri "kim ki, ki" anlamında ilgi zamiri
  ve bağlaç olarak da kullanılır (ki'nin kaynağı); kimse, kimerse, kimesne türevleri.
kaynak: savelyev-turkic; clauson; wiktionary-ana-turkce

taniklar:
  - dil: otk
    yuzyil: 8-14
    bicim: kim
    metin: Göktürk ve Eski Uygurca metinler
    kaynak: clauson; savelyev-turkic
    atif: Clauson s. 720-721
    not: Soru zamiri ve ilgi zamiri (ot kim ığaçda ünüp 'ağaçta beliren ateş'). Savelyev Clauson'dan
      kem okur.
  - dil: xqa
    yer: Kâşgar
    yuzyil: 11
    bicim: kim
    metin: Dîvânu Lugâti't-Türk
    kaynak: dlt; clauson
    atif: DLT I 338
    kaydeden: Kâşgarlı Mahmud
    not: Yazmada aşağı yukarı yarı yarıya kim ve uzun ünlüyle kīm; tekil ve çoğul için.
  - dil: oguz
    boy: Oğuz
    yuzyil: 11
    bicim: kim
    metin: Dîvânu Lugâti't-Türk
    kaynak: dlt; clauson
    atif: DLT I 338
    kaydeden: Kâşgarlı Mahmud
  - dil: xqa
    yuzyil: 11-13
    bicim: kim
    metin: Kutadgu Bilig; Atebetü'l-Hakayık; Karahanlıca Kur'an tefsiri
    kaynak: clauson
    not: kayu kim 'her kim', kaçan kim 'ne zaman ki', kimse 'biri'.
  - dil: xbo
    yuzyil: 13-14
    bicim: kem
    yazi: كم
    metin: Volga Bulgar mezar taşları
    kaynak: wiktionary-ana-turkce
    atif: Erdal 1993 s. 69-70
  - dil: chg
    yer: Harezm
    yuzyil: 13-14
    bicim: kim
    metin: Harezm Türkçesi metinleri; Nehcü'l-Feradis
    kaynak: clauson
    not: kimerse, kimse, kimesne.
  - dil: ortak
    yuzyil: 14
    bicim: kīm
    metin: İbn Mühennâ Lügati
    kaynak: ibn-muhenna; clauson
    kaydeden: İbn Mühennâ (Arapça sözlük)
    not: Soru ve ilgi zamiri olarak.
  - dil: qwm
    yer: Kırım ve Deşt-i Kıpçak
    yuzyil: 14
    bicim: kim
    metin: Codex Cumanicus
    kaynak: gronbech-kuman; clauson; savelyev-turkic
    kaydeden: İtalyan tüccarlar ve Alman Fransisken misyonerler (Latin harfli)
    yabanci: true
    not: Yazmada kym ve kim yazımları.
  - dil: qwm
    yer: Memlük Mısır'ı
    yuzyil: 13-14
    bicim: kim
    metin: Memlük Kıpçakçası sözlükleri
    kaynak: clauson
    kaydeden: Memlük sözlükçüleri (Arapça)
    yabanci: true
  - dil: chg
    yuzyil: 15-18
    bicim: kim
    metin: Çağatay edebî dili; Senglâh
    kaynak: clauson; senglah
  - dil: eski-anadolu
    yuzyil: 13-15
    bicim: kim
    metin: Eski Anadolu Türkçesi metinleri
    kaynak: wiktionary-ana-turkce
    yazi: كم
