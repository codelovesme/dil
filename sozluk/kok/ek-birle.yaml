# Sözlük maddesi (Hedef 4) — bkz. ILKELER.md §14
kok: ek-birle
anlam: '"vasıta edatı ve eki ile < birle"'
koken: türkçe
ana_turkce: '*birle'
kavramlar:
- vasita
etimoloji: Eski Türkçe birle (ile). Oğuz ve Altayda ekleşmiş -(y)lA; Kıpçak dillerinde men,
  menen, menän; Karluk ve Tatar bilan, bilän, belän; Türkmen bilen. Bu biçimlerin tek köke
  bağlanması yaygın görüştür; bu çalışmada ayrı bir kaynakla denetlenmedi.
kaynak: apertium; universal-dependencies; tatoeba

