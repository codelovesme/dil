# Sözlük maddesi (Hedef 4) — bkz. ILKELER.md §14
kok: köz
anlam: '"göz"'
koken: türkçe
ana_turkce: '*köŕ'
kavramlar:
- goz
etimoloji: Ana Türkçe *köŕ. Oğuz'da göz, Kıpçak-Bulgar'da küz, Altay'da kös; Çuvaşça kuş (Oğur
  ŕ > ş). Sibirya dillerinin çoğunda 'göz' için karak kullanılır.
kaynak: savelyev-turkic; wiktionary-ana-turkce

