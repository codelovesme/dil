    yer: Kırım ve Deşt-i Kıpçak
    yuzyil: 14
    metin: Codex Cumanicus
    kaydeden: İtalyan tüccarlar ve Alman Fransisken misyonerler (Latin harfli)
    yabanci: true
    bicim: köz
    kaynak: savelyev-turkic
    atif: noauthor1880
    denetim: {durum: tek-kaynak, bicim: [savelyev-turkic], anlam: [savelyev-turkic]}
