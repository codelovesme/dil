# Sözlük maddesi (Hedef 4) — bkz. ILKELER.md §14, şablon: .claude/skills/kelime-arastir/kok-sablon.yaml
kok: siz
anlam: ikinci çoğul şahıs zamiri ("siz"); birçok dilde saygı için tekil de
koken: türkçe
ana_turkce: "*siŕ"
kavramlar: [siz]
etimoloji: >-
  Ana Türkçe *siŕ, *se- zamir gövdesine çokluk *-ŕ ekinin gelmesiyle oluşmuştur (krş.
  *biŕ "biz"). Ortak Türkçede -z, Oğur'da (Çuvaşça) -r: esir. Sibirya, Kırgız ve Altay
  dillerinde çokluk eki -lAr eklenmiş türev yaygındır (siler, sler, sirer); Sahaca ve
  Dolgancada genişlemiş biçim (ehigi). Saygı tekili olarak kullanımı 11. yüzyılda
  Kâşgarlı'da kayıtlıdır.
kaynak: wiktionary-ana-turkce; clauson

taniklar:
  # ================================================ tarihî tanıklar
  - dil: otk
    yer: Orhon, Moğolistan
    yuzyil: 8
    bicim: siz
    yazi: 𐰾𐰃𐰕
    metin: Göktürk yazıtları
    kaynak: wiktionary-ana-turkce; clauson
  - dil: otk
    yer: Turfan ve Dunhuang
    yuzyil: 8-14
    bicim: siz
    metin: Maniheist, Budist ve hukuk belgeleri (Eski Uygurca)
    kaynak: clauson; wiktionary-ana-turkce
    not: Çokluk biçimi sizler de görülür.
  - dil: otk
    yer: Yenisey, Tuva ve Hakasya
    yuzyil: 9-10
    bicim: siz
    metin: Eski Kırgız (Yenisey) mezar yazıtları
    kaynak: clauson
    atif: Malov
    not: Ölenin ayrıldığı kişileri ve yurdu sayan kalıplarda çok sık (siz elime "sizden, yurdumdan").
  - dil: xqa
    yer: Kâşgar ve Çiğil
    yuzyil: 11
    bicim: siz
    metin: Dîvânu Lugâti't-Türk
    kaynak: dlt; clauson
    atif: DLT III 124; I 339
    kaydeden: Kâşgarlı Mahmud (Arapça açıklamalı)
    anlam: Çiğiller'de büyüğe saygıyla "sen"; asıl anlamı "siz"
    not: Kâşgarlı'ya göre Çiğiller büyüğe siz, küçüğe sen der; Oğuzlar bunun tersini yapar.
  - dil: xqa
    yuzyil: 13
    bicim: siz
    metin: Atebetü'l-Hakayık; Karahanlıca Kur'an tefsiri
    kaynak: clauson
    not: Tefsirde çokluk biçimi sizler ve bütün durumları.
  - dil: qwm
    yer: Memlük Mısır'ı
    yuzyil: 13
    bicim: siz
    metin: Leiden yazması Arapça-Türkçe sözlük (1245)
    kaynak: houtsma-leiden; clauson
    atif: Houtsma 50, 8
    kaydeden: Memlük sarayında Arapça yazan bir sözlükçü
  - dil: ortak
    yuzyil: 14
    bicim: sīz
    metin: İbn Mühennâ Lügati
    kaynak: ibn-muhenna; clauson
    atif: Melioranskiy 5, 17
    kaydeden: İbn Mühennâ (Arapça sözlük)
    not: biz gibi uzun ünlüyle verilir.
  - dil: chg
    yer: Harezm ve Altın Orda
    yuzyil: 14
    bicim: siz
    metin: Kutb, Hüsrev ü Şirin; Nehcü'l-Feradis
    kaynak: clauson; najip-xiv
  - dil: qwm
    yer: Kırım ve Deşt-i Kıpçak
    yuzyil: 14
    bicim: siz
    metin: Codex Cumanicus
    kaynak: gronbech-kuman; clauson
    kaydeden: İtalyan tüccarlar ve Alman Fransisken misyonerler (Latin harfli)
    yabanci: true
  - dil: qwm
    yer: Kahire
    yuzyil: 14
    bicim: siz
    metin: Kitâbü'l-İdrâk; Bulgatü'l-Müştâk
    kaynak: kitab-idrak; clauson
    kaydeden: Ebû Hayyân ve öteki Memlük sözlükçüleri (Arapça)
    yabanci: true
  - dil: qwm
    yer: Memlük Mısır'ı
    yuzyil: 15
    bicim: siz
    metin: el-Kavânînü'l-Külliye; et-Tuhfetü'z-Zekiyye
    kaynak: clauson
  - dil: eski-anadolu
    yer: Anadolu
    yuzyil: 13-15
    bicim: siz
    metin: Eski Anadolu Türkçesi metinleri
    kaynak: wiktionary-ana-turkce
  - dil: chg
    yuzyil: 15-18
    bicim: siz
    yazi: سیز
    metin: Çağatay edebî dili; Senglâh
    kaynak: clauson; senglah
  - dil: tur
    yer: Osmanlı
    yuzyil: 16-19
    bicim: siz
    yazi: سز
    metin: Osmanlı Türkçesi
    kaynak: wiktionary-ana-turkce

