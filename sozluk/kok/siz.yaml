# Sözlük maddesi (Hedef 4) — bkz. ILKELER.md §14, şablon: .claude/skills/kelime-arastir/kok-sablon.yaml
kok: siz
anlam: ikinci çoğul şahıs zamiri ("siz"); birçok dilde saygı için tekil de
koken: türkçe
ana_turkce: "*siŕ"
kavramlar: [siz]
etimoloji: >-
  Ana Türkçe *siŕ, *se- zamir gövdesine çokluk *-ŕ ekinin gelmesiyle oluşmuştur (krş.
  *biŕ "biz"). Ortak Türkçede -z, Oğur'da (Çuvaşça) -r: esir. Sibirya, Kırgız ve Altay
  dillerinde çokluk eki -lAr eklenmiş türev yaygındır (siler, sler, sirer); Sahaca ve
  Dolgancada genişlemiş biçim (ehigi). Saygı tekili olarak kullanımı 11. yüzyılda
  Kâşgarlı'da kayıtlıdır.
kaynak: wiktionary-ana-turkce; clauson

taniklar:
  # ================================================ tarihî tanıklar
  - dil: otk
    yer: Orhon, Moğolistan
    yuzyil: 8
    bicim: siz
    yazi: 𐰾𐰃𐰕
    metin: Göktürk yazıtları
    kaynak: wiktionary-ana-turkce; clauson
    denetim: {durum: dogrulandi, bicim: [wiktionary-ana-turkce, clauson], anlam: [wiktionary-ana-turkce, clauson]}
  - dil: otk
    yer: Turfan ve Dunhuang
    yuzyil: 8-14
    bicim: siz
    metin: Maniheist, Budist ve hukuk belgeleri (Eski Uygurca)
    kaynak: clauson; wiktionary-ana-turkce
    not: Çokluk biçimi sizler de görülür.
    denetim: {durum: dogrulandi, bicim: [clauson, wiktionary-ana-turkce], anlam: [clauson, wiktionary-ana-turkce]}
