koken: türkçe
ana_turkce: '*tāĺ'
kavramlar:
- tas
etimoloji: 'Ana Türkçe *tāĺ (uzun a: Sahaca taas, Halaçça taaş). Oğuz''da t- > d- (daş), Kıpçak''ta
  tas; Çuvaşça çul (Oğur ĺ > l) Ana Türkçe *ĺ''nin başlıca kanıtıdır.'
kaynak: savelyev-turkic; wiktionary-ana-turkce

