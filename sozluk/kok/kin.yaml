# Sözlük maddesi (Hedef 4) — bkz. ILKELER.md §14
kok: kin
anlam: '"göbek"'
koken: türkçe
ana_turkce: '*kīn'
kavramlar:
- gobek
etimoloji: Ana Türkçe *kīn 'göbek'. Güney Altay kın, Tuva xin, Tofa hin, Saha kiin.
kaynak: savelyev-turkic

taniklar:
  - {atif: baskakov1947, bicim: kın, dil: alt, kaynak: savelyev-turkic, denetim: {durum: tek-kaynak, bicim: [savelyev-turkic], anlam: [savelyev-turkic]}}
  - {atif: 'rassadin1971, rassadin2005', bicim: hin, dil: kim, kaynak: savelyev-turkic, denetim: {durum: tek-kaynak, bicim: [savelyev-turkic], anlam: [savelyev-turkic]}}
  - {atif: 'harrison2002, mongus1988, tenisev1968; Apertium tyv sözlüğünde var', bicim: xin, dil: tyv, kaynak: savelyev-turkic; apertium, not: xindik de., yazi: хин, denetim: {durum: dogrulandi, bicim: [savelyev-turkic, apertium], anlam: [savelyev-turkic]}}
  - {atif: 'afanasjev1968, pekarskij1907, sleptsov1972; Apertium sah sözlüğünde var', bicim: kiin, dil: sah, kaynak: savelyev-turkic; apertium, yazi: киин, denetim: {durum: dogrulandi, bicim: [savelyev-turkic, apertium], anlam: [savelyev-turkic]}}

