# Sözlük maddesi (Hedef 4) — bkz. ILKELER.md §14
kok: kulkak
anlam: '"kulak"'
koken: türkçe
ana_turkce: '*kulkak'
kavramlar:
- kulak
etimoloji: Ana Türkçe *kulkak; Eski Türkçe kulkak. Ortak Türkçede -l- sonrası k düşmüş (kulak);
  Sahaca kulgaax ve Çuvaşça xălxa eski yapıyı korur.
kaynak: savelyev-turkic; wiktionary-ana-turkce

