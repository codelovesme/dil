# Sözlük maddesi (Hedef 4) — bkz. ILKELER.md §14
kok: kumursga
anlam: '"karınca"'
koken: türkçe
ana_turkce: '*kumursga'
kavramlar:
- karinca
etimoloji: Ana Türkçe *kumursga; Eski Türkçe kumursğa. Kıpçak, Kırgız ve Sibirya dillerinde
  (kumırska, kırmıska, xımısxa); Sahaca kımırdağas.
kaynak: savelyev-turkic

