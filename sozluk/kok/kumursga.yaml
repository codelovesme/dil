    yuzyil: 8-14
    metin: Göktürk ve Eski Uygurca metinler (Clauson'a göre)
    bicim: kumursğa
    kaynak: savelyev-turkic
    atif: clauson1972
  - {atif: 'uraksin1996, uraksin2005', bicim: kırmıska, dil: bak, kaynak: savelyev-turkic, yazi: ҡырмыҫҡа}
  - {atif: useinov2007, bicim: kımırska, dil: crh, kaynak: savelyev-turkic}
  - {atif: 'tenisev1989, sujuncev1965', bicim: kumursxa, dil: krc, kaynak: savelyev-turkic}
  - {atif: baskakov1974, bicim: kumurska, dil: kdr, kaynak: savelyev-turkic}
  - {atif: 'baskakov1958, baskakov1967', bicim: kumırska, dil: kaa, kaynak: savelyev-turkic}
  - {atif: 'bektaev1995, bekturov2001, sauranbaev1954', bicim: kumırska, dil: kaz, kaynak: savelyev-turkic, yazi: құмырсқа}
  - {atif: 'baskakov1953, cankov1961, subrakova2006', bicim: xımısxa, dil: kjh, kaynak: savelyev-turkic}
  - {atif: doerfer1980, bicim: gumurğaaç, dil: klj, kaynak: savelyev-turkic}
  - {atif: 'judakhin1985, judakhin1957', bicim: kumurska, dil: kir, kaynak: savelyev-turkic, yazi: кумурска}
