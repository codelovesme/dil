anlam: '"dilemek, istemek, sormak"'
koken: türkçe
ana_turkce: '*tile-'
kavramlar:
- sor
etimoloji: Ana Türkçe *tile- 'dilemek, istemek'; Eski Türkçe, Kafkas Kıpçak, Azerbaycan ve
  Sayan dillerinde 'sormak, istemek'.
