# Sözlük maddesi (Hedef 4) — bkz. ILKELER.md §14
kok: kayda
anlam: '"nerede?"; kayu "hangi" gövdesine bulunma eki'
koken: türkçe
ana_turkce: '*kayu-da'
kavramlar:
- nere
etimoloji: 'Soru gövdesi *ka- ile kurulan kayu "hangi"nin bulunma durumudur: kayuda > kayda.
  Kıpçak, Kırgız-Altay ve Sibirya dillerinde ortak soru sözü. Özbekçe kayerda ve Uygurca käyärdä
  "kay yerde" birleşiminden.'
