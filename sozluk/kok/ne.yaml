# Sözlük maddesi (Hedef 4) — bkz. ILKELER.md §14
kok: ne
anlam: nesneyi soran soru zamiri ("ne"); eski dilde "nasıl, niçin" anlamlarında da
koken: türkçe
ana_turkce: '*nē'
kavramlar:
- ne
etimoloji: 'Ana Türkçe *nē. Eski Türkçeden beri "ne?" sorusunun yanında ünlem, bağlaç ve ilgi
  zamiri olarak da kullanılır. Birçok dilde -mA ile genişlemiş biçim asıl kelime olmuştur:
  nemä, nime, näme, nima, emne (Kırgızca, ön ses n- düşerek). Kıpçak-Bulgar dillerinde ünlü
  daralmış (ni). Bu çalışmada genişlemiş biçimler aynı kökte toplandı.'
kaynak: savelyev-turkic; clauson; wiktionary-ana-turkce

