# Sözlük maddesi (Hedef 4) — bkz. ILKELER.md §14
kok: olar
anlam: üçüncü çoğul şahıs zamiri ("onlar"); ol + çokluk eki
koken: türkçe
ana_turkce: '*ol + *-lAr (eğik gövde *an-)'
kavramlar:
- onlar
etimoloji: 'Ol zamirinin çokluğu. İki gövdeden kurulur: yalın gövde ol- (olar) ve eğik gövde
  an- (anlar > onlar, alar). Eski Türkçe ve Karahanlıcada olar; Harezm, Kuman, Memlük Kıpçakçası
  ve Çağatayca anlar; Türkiye Türkçesi ve Azerbaycan Türkçesi onlar (eğik gövde ve -n-), Kırgız,
  Tatar, Karay ve Kuman alar. Çuvaşçada ol kökü vĕl''e, çoğulu Çuvaşçaya özgü -sem ekiyle
  vĕsem''e dönüşür.'
kaynak: savelyev-turkic; clauson

