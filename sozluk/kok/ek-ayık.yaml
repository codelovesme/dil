# Sözlük maddesi (Hedef 4) — bkz. ILKELER.md §14
kok: ek-ayık
anlam: '"1. çoğul istek eki -AyIk"'
koken: türkçe
kavramlar:
- istek-1c
etimoloji: Kıpçak -ayık (Kazak, Karakalpak, Tatar, Başkurt, Kırım Tatar, Kumuk, Karaçay-Malkar).
kaynak: apertium; universal-dependencies; tatoeba

taniklar:
  - {atif: 'apertium-bak.bak.lexc: -{A}y{I}k', bicim: ayık, dil: bak, kaynak: apertium, not: Tek kaynak (apertium); ikinci kaynakla doğrulanmadı., denetim: {durum: tek-kaynak, bicim: [apertium], anlam: [apertium]}}
  - {atif: 'apertium-crh.crh.lexc: -{A}y{I}{G}', bicim: ayık, dil: crh, kaynak: apertium, not: Tek kaynak (apertium); ikinci kaynakla doğrulanmadı., denetim: {durum: tek-kaynak, bicim: [apertium], anlam: [apertium]}}
  - {atif: 'Tatoeba metinleri (1 örnek: alayık)', bicim: ayık, dil: krc, kaynak: tatoeba, not: Tek kaynak (tatoeba); ikinci kaynakla doğrulanmadı., denetim: {durum: kismen, bicim: [tatoeba]}}
  - {atif: 'apertium-kaa.kaa.lexc: -{A}y{I}{K}', bicim: ayık, dil: kaa, kaynak: apertium, not: Tek kaynak (apertium); ikinci kaynakla doğrulanmadı., denetim: {durum: tek-kaynak, bicim: [apertium], anlam: [apertium]}}
  - {atif: 'apertium-kaz.kaz.lexc: -{A}y{I}{K}; UD_Kazakh-KTB: Person=1 Plur: ayık, yeyik; Tatoeba metinleri (7 örnek: tanısayık, karastırayık, oralayık)', bicim: ayık, dil: kaz, kaynak: apertium; universal-dependencies; tatoeba, denetim: {durum: dogrulandi, bicim: [apertium, universal-dependencies, tatoeba], anlam: [apertium, universal-dependencies]}}
  - {atif: 'apertium-kum.kum.lexc: -{A}y{I}k{ъ}', bicim: ayık, dil: kum, kaynak: apertium, not: Tek kaynak (apertium); ikinci kaynakla doğrulanmadı., denetim: {durum: tek-kaynak, bicim: [apertium], anlam: [apertium]}}
  - {atif: 'apertium-tat.tat.lexc: -{A}{E}k; Tatoeba metinleri (1 örnek: bulayık)', bicim: ayık, dil: tat, kaynak: apertium; tatoeba, denetim: {durum: dogrulandi, bicim: [apertium, tatoeba], anlam: [apertium]}}

