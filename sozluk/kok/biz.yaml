# Sözlük maddesi (Hedef 4) — bkz. ILKELER.md §14, şablon: .claude/skills/kelime-arastir/kok-sablon.yaml
# Okunur sayfa bu dosyadan üretilir: python3 araclar/yayinla.py
kok: biz
anlam: birinci çoğul şahıs zamiri ("biz")
koken: türkçe
ana_turkce: "*biŕ"
kavramlar: [biz]
etimoloji: >-
  Ana Türkçe *biŕ, *be-/*bi- zamir gövdesine çokluk bildiren *-ŕ ekinin gelmesiyle
  oluşmuştur (krş. *siŕ "siz"). Ortak Türkçede -z, Oğur'da (Çuvaşça) -r: epir. Ünlü
  ince i'dir ve ben'deki b- > m- değişimi biz'de görülmez. Başta b- ~ p- Güney Sibirya
  dillerinde (pis, pız), -z > -s Sayan ve Altay'da (bis), Sahaca ve Dolgancada genişlemiş
  bir biçim (bihigi). Eski Türkçede hem özne hem de cümle sonunda bağ (koşaç) olarak
  kullanılır; bugünkü 1. çoğul kişi ekleri (-ız, -mız) buradan gelir.
kaynak: wiktionary-ana-turkce; clauson

taniklar:
  # ================================================ tarihî tanıklar
  - dil: otk
    atif: "Wiktionary Reconstruction:Proto-Turkic/bīz; sayfanın kaynakları: yok"
    yer: Orhon, Moğolistan
    yuzyil: 8
    bicim: biz
    yazi: 𐰋𐰃𐰕
    metin: Kül Tigin, Bilge Kağan ve Tonyukuk yazıtları
    kaynak: clauson; wiktionary-ana-turkce
    not: Hem özne hem cümle sonunda bağ olarak; Tonyukuk'ta ikisi bir arada.
    denetim: {durum: dogrulandi, bicim: [clauson, wiktionary-ana-turkce], anlam: [clauson, wiktionary-ana-turkce]}
  - dil: otk
    atif: "Wiktionary Reconstruction:Proto-Turkic/bīz; sayfanın kaynakları: yok"
    yer: Turfan ve Dunhuang
    yuzyil: 8-14
    bicim: biz
    metin: Maniheist, Budist ve hukuk belgeleri (Eski Uygurca)
    kaynak: clauson; wiktionary-ana-turkce
    not: Hukuk belgelerinde "biz" ardından kişi adları sık geçer.
    denetim: {durum: dogrulandi, bicim: [clauson, wiktionary-ana-turkce], anlam: [clauson, wiktionary-ana-turkce]}
  - dil: xqa
    yer: Kâşgar
    yuzyil: 11
    bicim: biz
    yazi: بِزْ
    metin: Dîvânu Lugâti't-Türk
    kaynak: dlt; clauson
    atif: DLT I 325
    kaydeden: Kâşgarlı Mahmud (Arapça açıklamalı)
    denetim: {durum: tek-kaynak, bicim: [dlt, clauson], anlam: [dlt, clauson]}
  - dil: xqa
    yuzyil: 13
    bicim: biz
    metin: Karahanlıca Kur'an tefsiri
    kaynak: clauson
    not: Eğik durumlarda da yaygın.
    denetim: {durum: tek-kaynak, bicim: [clauson], anlam: [clauson]}
  - dil: qwm
    yer: Memlük Mısır'ı
    yuzyil: 13
    bicim: biz
    metin: Leiden yazması Arapça-Türkçe sözlük (1245)
    kaynak: houtsma-leiden; clauson
    atif: Houtsma 50, 9
    kaydeden: Memlük sarayında Arapça yazan bir sözlükçü
    denetim: {durum: tek-kaynak, bicim: [houtsma-leiden, clauson], anlam: [houtsma-leiden, clauson]}
  - dil: ortak
    yuzyil: 14
    bicim: bīz
    metin: İbn Mühennâ Lügati
    kaynak: ibn-muhenna; clauson
    atif: Melioranskiy 5, 17
    kaydeden: İbn Mühennâ (Arapça sözlük)
    not: Sözlükçü kelimeyi, i'si Arapçadaki gibi (uzun) okunan kelimelere örnek verir.
    denetim: {durum: tek-kaynak, bicim: [ibn-muhenna, clauson], anlam: [ibn-muhenna, clauson]}
  - dil: chg
    yer: Harezm ve Altın Orda
    yuzyil: 14
    bicim: biz
    metin: Kutb, Hüsrev ü Şirin; Nehcü'l-Feradis
    kaynak: clauson; najip-xiv
    denetim: {durum: tek-kaynak, bicim: [clauson, najip-xiv], anlam: [clauson, najip-xiv]}
  - dil: qwm
    yer: Kırım ve Deşt-i Kıpçak
    yuzyil: 14
    bicim: biz
    metin: Codex Cumanicus
    kaynak: gronbech-kuman; clauson
    kaydeden: İtalyan tüccarlar ve Alman Fransisken misyonerler (Latin harfli)
    yabanci: true
    denetim: {durum: dogrulandi, bicim: [gronbech-kuman, clauson], anlam: [gronbech-kuman, clauson]}
  - dil: qwm
    yer: Kahire
    yuzyil: 14
    bicim: biz
    metin: Kitâbü'l-İdrâk, Bulgatü'l-Müştâk, et-Tuhfetü'z-Zekiyye
    kaynak: kitab-idrak; clauson
    kaydeden: Ebû Hayyân ve öteki Memlük sözlükçüleri (Arapça)
    yabanci: true
    not: Ebû Hayyân m-'li bir söyleyişi (miz) de kaydeder.
    denetim: {durum: tek-kaynak, bicim: [kitab-idrak, clauson], anlam: [kitab-idrak, clauson]}
  - dil: qwm
    yer: Memlük Mısır'ı
    yuzyil: 15
    bicim: biz
    metin: el-Kavânînü'l-Külliye
    kaynak: clauson
    denetim: {durum: tek-kaynak, bicim: [clauson], anlam: [clauson]}
  - dil: eski-anadolu
    atif: "Wiktionary Reconstruction:Proto-Turkic/bīz; sayfanın kaynakları: yok"
    yer: Anadolu
    yuzyil: 13-15
    bicim: biz
    yazi: بز
    metin: Eski Anadolu Türkçesi metinleri
    kaynak: wiktionary-ana-turkce
    not: 'Eki -vüz/-üz biçiminde de görülür. Kısmen doğrulandı: biçim Arap harfli yazıdan Wiktionary editörünün okuması; yazı ünlüleri göstermediği için ünlüler tahmindir. Tarama Sözlüğü gibi bir kaynakla denetlenmeli.'
    denetim: {durum: kismen, bicim: [wiktionary-ana-turkce], anlam: [wiktionary-ana-turkce]}
  - dil: chg
    yuzyil: 15-18
    bicim: biz
    yazi: بیز
    metin: Çağatay edebî dili; Senglâh
    kaynak: clauson; senglah
    not: Senglâh hem zamir hem cümle sonu bağ kullanımını verir.
    denetim: {durum: dogrulandi, bicim: [clauson, senglah], anlam: [clauson, senglah]}
  - dil: tur
    atif: "Wiktionary Reconstruction:Proto-Turkic/bīz; sayfanın kaynakları: yok"
    yer: Osmanlı
    yuzyil: 16-19
    bicim: biz
    yazi: بز
    metin: Osmanlı Türkçesi
    kaynak: wiktionary-ana-turkce
    not: 'Kısmen doğrulandı: biçim Arap harfli yazıdan Wiktionary editörünün okuması; yazı ünlüleri göstermediği için ünlüler tahmindir. Tarama Sözlüğü gibi bir kaynakla denetlenmeli.'
    denetim: {durum: kismen, bicim: [wiktionary-ana-turkce], anlam: [wiktionary-ana-turkce]}

