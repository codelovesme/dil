  - dil: qwm
    yer: Kahire
    yuzyil: 14
    bicim: biz
    metin: Kitâbü'l-İdrâk, Bulgatü'l-Müştâk, et-Tuhfetü'z-Zekiyye
    kaynak: kitab-idrak; clauson
    kaydeden: Ebû Hayyân ve öteki Memlük sözlükçüleri (Arapça)
    yabanci: true
    not: Ebû Hayyân m-'li bir söyleyişi (miz) de kaydeder.
  - dil: qwm
    yer: Memlük Mısır'ı
    yuzyil: 15
    bicim: biz
    metin: el-Kavânînü'l-Külliye
    kaynak: clauson
  - dil: eski-anadolu
    yer: Anadolu
    yuzyil: 13-15
    bicim: biz
    yazi: بز
    metin: Eski Anadolu Türkçesi metinleri
    kaynak: wiktionary-ana-turkce
    not: Eki -vüz/-üz biçiminde de görülür.
  - dil: chg
