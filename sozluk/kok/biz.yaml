    metin: Karahanlıca Kur'an tefsiri
    kaynak: clauson
    not: Eğik durumlarda da yaygın.
  - dil: qwm
    yer: Memlük Mısır'ı
    yuzyil: 13
    bicim: biz
    metin: Leiden yazması Arapça-Türkçe sözlük (1245)
    kaynak: houtsma-leiden; clauson
    atif: Houtsma 50, 9
    kaydeden: Memlük sarayında Arapça yazan bir sözlükçü
  - dil: ortak
    yuzyil: 14
    bicim: bīz
    metin: İbn Mühennâ Lügati
    kaynak: ibn-muhenna; clauson
    atif: Melioranskiy 5, 17
    kaydeden: İbn Mühennâ (Arapça sözlük)
    not: Sözlükçü kelimeyi, i'si Arapçadaki gibi (uzun) okunan kelimelere örnek verir.
  - dil: chg
    yer: Harezm ve Altın Orda
    yuzyil: 14
    bicim: biz
    metin: Kutb, Hüsrev ü Şirin; Nehcü'l-Feradis
    kaynak: clauson; najip-xiv
  - dil: qwm
    yer: Kırım ve Deşt-i Kıpçak
    yuzyil: 14
    bicim: biz
    metin: Codex Cumanicus
    kaynak: gronbech-kuman; clauson
    kaydeden: İtalyan tüccarlar ve Alman Fransisken misyonerler (Latin harfli)
