# Sözlük maddesi (Hedef 4) — bkz. ILKELER.md §14, şablon: .claude/skills/kelime-arastir/kok-sablon.yaml
# Okunur sayfa bu dosyadan üretilir: python3 araclar/yayinla.py
kok: biz
anlam: birinci çoğul şahıs zamiri ("biz")
koken: türkçe
ana_turkce: "*biŕ"
kavramlar: [biz]
etimoloji: >-
  Ana Türkçe *biŕ, *be-/*bi- zamir gövdesine çokluk bildiren *-ŕ ekinin gelmesiyle
  oluşmuştur (krş. *siŕ "siz"). Ortak Türkçede -z, Oğur'da (Çuvaşça) -r: epir. Ünlü
  ince i'dir ve ben'deki b- > m- değişimi biz'de görülmez. Başta b- ~ p- Güney Sibirya
  dillerinde (pis, pız), -z > -s Sayan ve Altay'da (bis), Sahaca ve Dolgancada genişlemiş
  bir biçim (bihigi). Eski Türkçede hem özne hem de cümle sonunda bağ (koşaç) olarak
  kullanılır; bugünkü 1. çoğul kişi ekleri (-ız, -mız) buradan gelir.
kaynak: wiktionary-ana-turkce; clauson

taniklar:
