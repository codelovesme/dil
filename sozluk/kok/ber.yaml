etimoloji: 'Ana Türkçe *bēr- (uzun ē: Sahaca, Dolganca ve Halaççada ie). Oğuz dillerinde b-
  > v- (ver-), Kıpçak-Bulgar''da e > i (bir-), Güney Sibirya''da p-, Çuvaşça par-.'
