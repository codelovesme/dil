# Sözlük maddesi (Hedef 4) — bkz. ILKELER.md §14
kok: bu
anlam: yakındakini gösteren işaret zamiri ("bu")
koken: türkçe
ana_turkce: '*bu (eğik gövde *mun-)'
kavramlar:
- bu
etimoloji: Ana Türkçe *bu; eğik durumlar en eski metinlerden beri m-'li gövdeden kurulur (muni,
  muñar, munda), b- > m- değişimi genizsil ünsüzün etkisiyledir. Bugün Türkiye Türkçesi bunu,
  burada gibi b-'li eğik biçimleri genelleştirmiştir; Özbekçe ve Uygurca munda ~ bunda ikiliğini
  korur. Kazakça, Karakalpakça ve Başkurtçada -l eklenmiş biçim (bul, bıl), Güney Sibirya'da
  başta p- (pu, po), Sayan'da o (bo).
kaynak: savelyev-turkic; clauson

