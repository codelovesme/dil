# Türk dilleri örgüsü (mesh)
# ------------------------------------------------------------------
# Soy ağacı (agac.yaml) dillerin nereden geldiğini söyler. Bu dosya ise
# diller arasındaki öteki bağları tutar. Ağaçta "hangi dalın altına
# koymalı?" sorusunun cevabı çoğu zaman "ikisine de bağlı" olduğu için,
# bu bağlar ağırlıklı ve gerektiğinde yönlüdür.
#
# Kodlar agac.yaml'daki DİL kodlarıdır (ağız kodları değil).
#
# anlasilirlik: [a, b, ab, ba]   — DİLBİLİMSEL yakınlık
#   ab: a dilini konuşan biri, b dilini (öğrenmeden) ne kadar anlar (0..1)
#   ba: b dilini konuşan biri a dilini ne kadar anlar; yazılmazsa ab ile aynı
#   Yazılmayan çiftler 0 sayılır.
#   Kullanıldığı yer: Hedef 1 (dilin "anlaşılırlık çevresi") ve Hedef 3.
#
# ikinci_dil: [dinleyen, konusan, deger]   — İKİNCİ DİL bilgisi
#   dinleyen dili konuşanların, konusan dili ikinci dil olarak (okul, medya,
#   iki dillilik yoluyla) ne kadar anladığı. Dilbilimsel yakınlıktan ayrıdır:
#   Halaçlar Azerbaycan Türkçesini iyi bilir, ama iki dil birbirinden uzaktır.
#   Kullanıldığı yer: sadece Hedef 3 ("kaç kişi anlar").
#
# temas: [veren, alan, deger]
#   veren dilden alan dile ne yoğunlukta kelime geçtiği (0..1).
#   Kullanıldığı yer: Hedef 2 (Türk dilleri arası ödünçleri ayıklamak).
#
# DURUM (yöntem sürüm 1, 2026-11-13): Elle yazılan değerler alan bilgisine
# dayanan tahminlerdir. 197 kavramlık veriyle denetlendi (araclar/orgu.py,
# ORGU.md): korelasyon 0.85. Veriden çok sapan 6 tahmin düzeltildi (satır
# yorumlarında önceki değer), 2'si gerekçesiyle korundu. Tahmini olmayan
# çiftler ("veriden" bölümü) veriden dolduruldu; o bölüm araçla yenilenir.

