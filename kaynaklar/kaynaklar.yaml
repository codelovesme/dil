    tur: sozluk
    diller: [tur, eski-anadolu]
    kullanim: [bicim, agiz, tarihi, ana_turkce]
    ne: >-
      TDK'nin bütün sözlükleri tek portalda: Güncel Türkçe Sözlük, Derleme Sözlüğü
      (Anadolu ağızları), Tanıklarıyla Tarama Sözlüğü (Eski Anadolu Türkçesi),
      Köken Bilgisi (etimoloji) Sözlüğü, terim sözlükleri.
    nasil: >-
      Belgelenmiş olmayan JSON ucu: https://sozluk.gov.tr/gts?ara=<kelime> (Güncel Türkçe
      Sözlük; dizi döner, bulunamazsa {"error": ...}). Diğer sözlükler sitenin içinde ayrı
      sayfalar (/ds Derleme, /ts Tarama, /etms Köken Bilgisi, /lehceler Karşılaştırmalı
      Türk Lehçeleri, /osmanlica, /bati, /ads). Bu sayfalar HTML uygulamasıdır; veriyi
      https://api.sozluk.gov.tr altındaki uçlardan çeker (uygulama kodunda görülen yollar:
      /gts-yeni/arama, /gts-yeni/maddeler-detay, /yeni-derleme, /koken-bilgisi,
      /lehceler). Hazır sarmalayıcı: tdk-py (Python). Derleme Sözlüğü ağız kodlarını
      (tur-ege, tur-erzurum…), Tarama Sözlüğü eski-anadolu tanığını, Lehçeler Sözlüğü 8
