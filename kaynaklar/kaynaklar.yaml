# Kaynak sözlüğü
# ------------------------------------------------------------------
# Projenin işine yarayan internet kaynakları, veri setleri ve basılı eserler.
# KAYNAKLAR.md bu dosyadan üretilir:
#     python3 araclar/kaynaklar.py > kaynaklar/KAYNAKLAR.md
#
# Alanlar:
#   kimlik       : kısa ad (başka dosyalardan atıf için)
#   ad           : kaynağın adı
#   url          : ana adres (basılı eserlerde katalog ya da yayınevi sayfası)
#   tur          : sozluk | etimoloji | veri-seti | derlem | tarihi | belgeleme |
#                  siniflandirma | nufus | anlasilirlik | ses | yazim | portal |
#                  dergi | arac | kavram-listesi
#   diller       : agac.yaml dil kodları, tarihi.yaml tanık kodları ya da "tum"
#   kullanim     : hangi ihtiyaçlara yarar (aşağıdaki IHTIYACLAR listesine bakın)
#   ne           : ne işe yarar, ne içerir
#   nasil        : nasıl kullanılır (sorgu biçimi, indirme, dikkat edilecekler)
#   erisim       : acik | kismen | ucretli | basili
#   bicim        : web | pdf | csv | json | api | git | basili
#   guven        : yuksek (hakemli, uzman) | orta (derlenmiş, topluluk) | dusuk (küçük liste, kaba tahmin)
#   durum        : denendi (bu ortamdan açıldı) | arandi (arama sonucunda görüldü, açılmadı) |
#                  basili (çevrim içi değil)
#   not          : ek bilgi, sınırlar
#
# Bu ortamın ağ izni olan adresler (environment: dil). Listede olmayan bir adrese
# erişmek için ortam ayarlarına eklenmesi gerekir.

izinli_hostlar:
  - en.wiktionary.org
  - starling.rinet.ru
  - starlingdb.org

ihtiyaclar:
  ana_turkce: Ana Türkçe kuruluşu ve etimoloji
  bicim: Yaşayan dillerde biçim toplama
  agiz: Ağız verisi
  tarihi: Tarihî tanık biçimleri
  odunc: Ödünç ve miras ayrımı (özellikle Çuvaşça)
  ag: "Örgü: benzerlik ve anlaşılırlık değerleri"
  agac: Sınıflandırma (soy ağacı)
  konusur: Konuşur sayısı ve canlılık
  sira: Sıklık listeleri ve kavram listeleri
  ses: Ses denklikleri
  yazim: Ortak alfabe ve yazım
  dilbilgisi: Dilbilgisi (Aşama 3)
  toplu: Toplu, makinece okunabilir veri
  literatur: Makaleler ve bibliyografya

kaynaklar:

  # ================================================== ETİMOLOJİ VE KARŞILAŞTIRMA

  - kimlik: wiktionary-ana-turkce
    ad: Wiktionary — Ana Türkçe (Proto-Turkic) maddeleri
    url: https://en.wiktionary.org/wiki/Category:Proto-Turkic_lemmas
    tur: etimoloji
    diller: [tum]
    kullanim: [ana_turkce, bicim, tarihi]
    ne: >-
      Ana Türkçe yeniden kuruluşları ve her maddenin altında torun dillerdeki
      biçimler (30-40 dil), çekim tablosu, kaynakça (Clauson, ESTJa, Räsänen, DLT).
    nasil: >-
      Ham metin: https://en.wiktionary.org/wiki/Reconstruction:Proto-Turkic/<kök>?action=raw.
      Çoğu madde yönlendirmedir (ör. ben → be, sen → se); yönlendirmeyi izle.
      API'yi (w/api.php) sık çağırma: Wikimedia hız sınırı uyguluyor; istekler
      arasında bekle ve genel bir User-Agent kullan.
    erisim: acik
    bicim: web
    guven: orta
    durum: denendi
    not: Kaynakçası iyi ama topluluk ürünüdür; küçük diller ve ağızlar eksik olabilir.

  - kimlik: wiktionary-swadesh
    ad: Wiktionary — Türk dilleri Swadesh listeleri
    url: https://en.wiktionary.org/wiki/Appendix:Turkic_Swadesh_lists
    tur: kavram-listesi
    diller: [tum]
    kullanim: [bicim, sira]
    ne: >-
      Ana Türkçe ve 25 dil için (Türkiye, Azerbaycan, Türkmen, Kumuk, Karaçay-Malkar,
      Kırım Tatar, Tatar, Sibirya Tatar, Başkurt, Kazak, Karakalpak, Nogay, Kırgız,
      Güney/Kuzey Altay, Şor, Eski Türkçe, Özbek, Uygur, Karahanlıca, Tuva, Hakas,
      Saha, Çuvaş) Swadesh listesi.
    nasil: Sayfa otomatik şablonla üretiliyor; tablo HTML'den okunur.
    erisim: acik
    bicim: web
    guven: orta
    durum: denendi

  - kimlik: wiktionary-hakkinda
    ad: Wiktionary — About Proto-Turkic (yazım ve kuruluş kuralları)
    url: https://en.wiktionary.org/wiki/Wiktionary:About_Proto-Turkic
    tur: etimoloji
    diller: [tum]
    kullanim: [ana_turkce, ses]
    ne: Wiktionary'nin Ana Türkçe kuruluşlarında kullandığı yazım ve ses kuralları.
    nasil: Ana Türkçe biçimlerini (*bẹ, *tāĺ…) okumadan önce bakılır.
    erisim: acik
    bicim: web
    guven: orta
    durum: denendi

  - kimlik: kaikki
    ad: kaikki.org — Wiktionary'nin makinece okunabilir hâli (wiktextract)
    url: https://kaikki.org/dictionary/rawdata.html
    tur: veri-seti
    diller: [tum]
    kullanim: [toplu, bicim, ana_turkce]
    ne: >-
      İngilizce Wiktionary'nin bütün maddeleri JSON Lines biçiminde; dil bazında
      indirilebilir dosyalar.
    nasil: >-
      Tek tek sayfa çekmek yerine ilgili dillerin dosyası bir kez indirilip yerelde
      aranır. Wikimedia hız sınırı sorununu çözer.
    erisim: acik
    bicim: json
    guven: orta
    durum: arandi
    not: Bu ortamda kaikki.org izinli değil; kullanmak için ortama eklenmeli.

  - kimlik: starling
    ad: StarLing — Türk etimoloji veritabanı (Starostin, Dybo, Mudrak)
    url: https://starlingdb.org/
    tur: etimoloji
    diller: [tum]
    kullanim: [ana_turkce, bicim, ses]
    ne: >-
      Türk dilleri etimoloji veritabanı (turcet); Ana Türkçe kuruluşlar, dillerdeki
      biçimler, Sevortyan/Räsänen göndermeleri. EDAL'ın (2003) çalışma ortamı.
    nasil: >-
      Sorgu: https://starlingdb.org/cgi-bin/response.cgi?root=config&morpho=0&basename=\data\alt\turcet&first=1&text_meaning=<anlam>&method_meaning=exact
      Eski adres starling.rinet.ru buraya yönlendiriyor.
    erisim: acik
    bicim: web
    guven: yuksek
    durum: denendi
    not: >-
      Denemede sunucu 504 (zaman aşımı) verdi; sonra tekrar denenmeli. Altay dil
      ailesi hipotezine dayanır: yalnızca Türk dilleri kısmı kullanılmalı.

  - kimlik: edal
    ad: Etymological Dictionary of the Altaic Languages (Starostin, Dybo, Mudrak 2003)
    url: https://en.wikipedia.org/wiki/Etymological_Dictionary_of_the_Altaic_Languages
    tur: etimoloji
    diller: [tum]
    kullanim: [ana_turkce]
    ne: 3 cilt, ~2.800 etimoloji; miras ile ödünç ayrımı yapar.
    nasil: Verisi StarLing'de çevrim içi.
    erisim: basili
    bicim: basili
    guven: orta
    durum: basili
    not: Altay hipotezi tartışmalıdır; Türk içi kuruluşları güvenilir, Altay karşılaştırmaları değil.

  - kimlik: estja
    ad: Этимологический словарь тюркских языков (ЭСТЯ, Sevortyan ve devamı)
    url: https://altaica.ru/LIBRARY/e_edtl.php
    tur: etimoloji
    diller: [tum]
    kullanim: [ana_turkce, bicim, ses]
    ne: >-
      Türk dillerinin en kapsamlı etimoloji sözlüğü. Cilt 1 (ünlüyle başlayanlar,
      1974), 2 (B, 1978), 3 (V/G/D, 1980), 4-6 (Ž/Y, K, Q), 7 (L/M/N/P/S, 2003);
      8. cilt hazırlanıyor.
    nasil: >-
      Altaica sayfasından cilt PDF'leri (ör. LIBRARY/ESTJA/estja1.pdf,
      LIBRARY/ESTJA/Estja7.pdf). Rusçadır; madde başları Türkçe köklerdir.
    erisim: kismen
    bicim: pdf
    guven: yuksek
    durum: arandi
    not: altaica.ru izinli değil. Taramaların telif durumu belirsiz.

  - kimlik: dybo-2013
    ad: Dybo — Этимологический словарь базисной лексики тюркских языков (2013, ЭСТЯ ek cilt 9)
    url: https://altaica.ru/LIBRARY/turks/Дыбо_Этимологический%20словарь%20базисной%20лексики%20тюркских%20языков%202013.pdf
    tur: etimoloji
    diller: [tum]
    kullanim: [ana_turkce, bicim, sira]
    ne: Temel söz varlığının (Swadesh tipi) etimoloji sözlüğü; Aşama 1 için birebir.
    nasil: PDF; kavram bazında düzenlenmiş.
    erisim: acik
    bicim: pdf
    guven: yuksek
    durum: arandi

  - kimlik: altaica-kutuphane
    ad: Monumenta Altaica — Türkoloji e-kütüphanesi
    url: https://altaica.c4.starlingdb.org/e_turkic_books.html
    tur: portal
    diller: [tum]
    kullanim: [literatur, ana_turkce, ses]
    ne: >-
      Türkoloji ve Altayistik kitaplarının PDF'leri (Poppe, Vladimirtsov, Karayca
      söz dizimi, Tenishev serisinin bazı ciltleri…). Altaica.ru ile aynı içerik.
    nasil: starlingdb.org alt alan adında olduğu için bu ortamdan erişilebilir olabilir.
    erisim: acik
    bicim: pdf
    guven: orta
    durum: arandi
    not: c4.starlingdb.org alt alan adı izin listesinde ayrıca yok; denenmeli.

  - kimlik: clauson
    ad: Clauson — An Etymological Dictionary of Pre-Thirteenth-Century Turkish (1972)
    url: https://archive.org/details/etymologicaldict00clau
    tur: etimoloji
    diller: [otk, xqa]
    kullanim: [ana_turkce, tarihi]
    ne: 13. yüzyıl öncesi Türkçenin (Eski Türkçe, Karahanlıca) temel etimoloji sözlüğü.
    nasil: Internet Archive'da ödünç alınabilir tarama; ayrı dizin cildi (Szeged 1981).
    erisim: kismen
    bicim: pdf
    guven: yuksek
    durum: arandi

  - kimlik: rasanen
    ad: Räsänen — Versuch eines etymologischen Wörterbuchs der Türksprachen (1969)
    url: https://openlibrary.org/search?q=Versuch+eines+etymologischen+W%C3%B6rterbuchs+der+T%C3%BCrksprachen
    tur: etimoloji
    diller: [tum]
    kullanim: [ana_turkce]
    ne: Türk dillerinin karşılaştırmalı etimoloji sözlüğü (Almanca).
    nasil: Basılı; Wiktionary maddelerinde sıkça atıf yapılır.
    erisim: basili
    bicim: basili
    guven: yuksek
    durum: basili

  - kimlik: unal-2026
    ad: Ünal — A Compendium of Common Turkic–Chuvash Lexical Correspondences with Proto-Turkic Reconstructions (2026)
    url: https://univerlag.uni-goettingen.de/handle/3/isbn-978-3-86395-657-8
    tur: etimoloji
    diller: [chv, tum]
    kullanim: [odunc, ana_turkce, ses]
    ne: >-
      Ortak Türkçe ile Çuvaşça arasındaki ortak kökenli kelimelerin derlemesi,
      Ana Türkçe kuruluşlarıyla. Çuvaşçadaki miras/ödünç ayrımı ve Hedef 2 (kök
      yaşı) için en doğrudan kaynak.
    nasil: Göttingen Üniversitesi Yayınevi; OAPEN açık erişim kaydı var (DOI 10.17875/gup2025-2765).
    erisim: acik
    bicim: pdf
    guven: yuksek
    durum: arandi

  - kimlik: elegant-lexicon
    ad: Elegant Lexicon — Turkic database (C. A. Straughn)
    url: https://turkic.elegantlexicon.com
    tur: veri-seti
    diller: [tum, qxq, aze, kmz, klj]
    kullanim: [bicim, toplu]
    ne: >-
      ~30.000 kayıtlık karşılaştırmalı Türk sözlüğü; 575 çekirdek kavram (uzun
      Swadesh listesi, Doerfer'in listeleri). İran'daki küçük Oğuz çeşitleri
      (Sonkor vb.) dahil.
    nasil: Biçim sayfaları ör. lxforms.php?lx=snq (dil kodu). Wiktionary'de kaynak olarak kullanılıyor.
    erisim: acik
    bicim: web
    guven: orta
    durum: arandi

  - kimlik: savelyev-turkic
    ad: Savelyev & Robbeets — Turkic Basic Vocabularies (lexibank/savelyevturkic)
    url: https://github.com/lexibank/savelyevturkic
    tur: veri-seti
    diller: [tum]
    kullanim: [ag, toplu, bicim, ana_turkce, odunc]
    ne: >-
      32 Türk dilinde 254 temel kavram (Leipzig-Jakarta + Jena 200). Her kelimenin
      akrabalık sınıfı ses denkliklerine göre belirlenmiş; açık ödünçler
      ayıklanmış. Savelyev & Robbeets 2020, Journal of Language Evolution 5(1).
    nasil: >-
      CLDF biçimi (forms.csv, cognates.csv, languages.csv). Zenodo sürümleri
      v1.0–v2.1. Örgüyü (ag.yaml) veriden hesaplamak ve kök yaşını denetlemek için
      birebir.
    erisim: acik
    bicim: csv
    guven: yuksek
    durum: arandi
    not: github.com ve zenodo.org bu ortamda izinli değil.

  - kimlik: northeuralex
    ad: NorthEuraLex
    url: https://lexibank.clld.org/contributions/northeuralex
    tur: veri-seti
    diller: [tur, aze, kaz, uzb, tat, bak, chv, sah, kjh, kir]
    kullanim: [ag, toplu, bicim]
    ne: >-
      107 Kuzey Avrasya dilinde 1.016 kavram, IPA ile. Türk dillerinin bir kısmı
      dahil. Dellert vd. 2020, Language Resources and Evaluation 54.
    nasil: CLDF; Lexibank üzerinden indirilir.
    erisim: acik
    bicim: csv
    guven: yuksek
    durum: arandi
    not: Kapsanan Türk dillerinin tam listesi doğrulanmadı.

  - kimlik: asjp
    ad: ASJP Database (Automated Similarity Judgment Program)
    url: https://asjp.clld.org
    tur: veri-seti
    diller: [tum]
    kullanim: [ag, toplu]
    ne: Dünyanın dilleri için 40 kavramlık kararlı kelime listeleri (sürüm 21, 2025); birçok Türk çeşidi (ör. OLD_TURKIC, QASHQAI_2).
    nasil: Dil sayfaları asjp.clld.org/languages/<AD>; toplu veri lexibank/asjp.
    erisim: acik
    bicim: csv
    guven: orta
    durum: arandi

  - kimlik: concepticon
    ad: Concepticon — kavram listeleri veritabanı
    url: https://concepticon.clld.org
    tur: kavram-listesi
    diller: [tum]
    kullanim: [sira, toplu]
    ne: >-
      Swadesh 100/207, Leipzig-Jakarta, ASJP, Savelyev-2020-254 gibi kavram
      listeleri ve ortak kavram kimlikleri.
    nasil: SIRA.md'deki kavramları ortak kimliklere bağlamak için; Zenodo'da indirilebilir sürümler.
    erisim: acik
    bicim: csv
    guven: yuksek
    durum: arandi

  - kimlik: panlex
    ad: PanLex
    url: https://dev.panlex.org/
    tur: veri-seti
    diller: [tum]
    kullanim: [bicim, toplu]
    ne: ~9.000 dil çeşidinde 20 milyon sözcük birimi ve 1,1 milyar çeviri çifti.
    nasil: HTTP API ve aylık CSV/JSON/XML anlık görüntüler.
    erisim: acik
    bicim: api
    guven: dusuk
    durum: arandi
    not: Kaynakları karışık kalitede; tek başına kanıt sayılmamalı.

  - kimlik: ronatas-bati-eski-turkce
    ad: Róna-Tas & Berta — West Old Turkic (Macarcadaki Türkçe ödünçler) veri seti
    url: https://github.com/LoanpyDataHub/ronataswestoldturkic
    tur: veri-seti
    diller: [chv, xbo]
    kullanim: [tarihi, odunc, ana_turkce]
    ne: >-
      Macarcaya Batı Eski Türkçeden (Oğur) geçmiş kelimeler. Oğur kolunun tarihî
      kanıtı olarak Hedef 2'ye ek tanık sağlar.
    nasil: Makinece okunabilir veri seti (CLDF).
    erisim: acik
    bicim: csv
    guven: yuksek
    durum: arandi

  - kimlik: wold-halac
    ad: Lexical copies in Khalaj — World Loanword Database (WOLD) katkısı
    url: https://openaccess.artvin.edu.tr/items/35435f9c-bcac-49af-9f4b-2066ad6a5cb9
    tur: veri-seti
    diller: [klj]
    kullanim: [odunc, bicim]
    ne: Halaççadaki ödünç kelimeler (Farsça, Azerbaycan Türkçesi…).
    nasil: Halaçça biçimlerinin miras mı ödünç mü olduğunu denetlemek için.
    erisim: acik
    bicim: pdf
    guven: yuksek
    durum: arandi

  - kimlik: proto-turkic-unsuzler
    ad: Sino-Platonic Papers 325 — Proto-Turkic consonants
    url: https://sino-platonic.org/complete/spp325_proto_Turkic_consonants.pdf
    tur: ses
    diller: [tum]
    kullanim: [ses, ana_turkce]
    ne: Ana Türkçe ünsüzleri üzerine açık erişimli çalışma.
    nasil: Ses kuralları aşamasında başvuru.
    erisim: acik
    bicim: pdf
    guven: orta
    durum: arandi

  # ================================================== TÜRKİYE TÜRKÇESİ

  - kimlik: tdk-portal
    ad: TDK Sözlükleri (Güncel Türkçe, Derleme, Tarama, Köken Bilgisi…)
    url: https://sozluk.gov.tr
    tur: sozluk
    diller: [tur, eski-anadolu]
    kullanim: [bicim, agiz, tarihi, ana_turkce]
    ne: >-
      TDK'nin bütün sözlükleri tek portalda: Güncel Türkçe Sözlük, Derleme Sözlüğü
      (Anadolu ağızları), Tanıklarıyla Tarama Sözlüğü (Eski Anadolu Türkçesi),
      Köken Bilgisi (etimoloji) Sözlüğü, terim sözlükleri.
    nasil: >-
      Belgelenmemiş JSON uç noktası: https://sozluk.gov.tr/gts?ara=<kelime> (dizi döner;
      bazen HTML ya da hata döner, kontrol et). Hazır sarmalayıcılar: tdk-py (Python).
      Derleme Sözlüğü ağız kodlarını (tur-ege, tur-erzurum…) doldurmak için,
      Tarama Sözlüğü eski-anadolu tanığı için.
    erisim: acik
    bicim: api
    guven: yuksek
    durum: arandi
    not: sozluk.gov.tr bu ortamda izinli değil.

  - kimlik: nisanyan
    ad: Nişanyan Sözlük — Çağdaş Türkçenin Etimolojisi
    url: https://www.nisanyansozluk.com
    tur: etimoloji
    diller: [tur]
    kullanim: [ana_turkce, odunc]
    ne: Türkiye Türkçesi kelimelerinin kökeni, ilk tanıklıkları.
    nasil: Madde adresi /kelime/<kelime>.
    erisim: kismen
    bicim: web
    guven: orta
    durum: arandi
    not: Türkçe kökenler konusunda eleştirileri var; Eren, Gülensoy, Tietze ile karşılaştır.

  - kimlik: tietze
    ad: Tietze — Tarihî ve Etimolojik Türkiye Türkçesi Lugatı (TÜBA)
    url: https://www.tuba.gov.tr
    tur: etimoloji
    diller: [tur, eski-anadolu]
    kullanim: [ana_turkce, tarihi, agiz]
    ne: ~42.000 madde başı, 71.000 örnek cümle; Kıbrıs vb. ağız verisi de içerir.
    nasil: Basılı (TÜBA, çok ciltli).
    erisim: basili
    bicim: basili
    guven: yuksek
    durum: basili

  - kimlik: tnc
    ad: Türkçe Ulusal Derlemi (TNC) ve Türkçe Sıklık Sözlüğü
    url: https://www.tnc.org.tr
    tur: derlem
    diller: [tur]
    kullanim: [sira]
    ne: >-
      50 milyon kelimelik dengeli Türkçe derlemi (1990-2009); Aksan vd. 2012
      Türkçe Sıklık Sözlüğü.
    nasil: Çalışma sırasını (SIRA.md) gerçek sıklığa göre düzeltmek için.
    erisim: kismen
    bicim: web
    guven: yuksek
    durum: arandi

  - kimlik: wowa
    ad: WOWA — Word Order in Western Asia derlemi (Bamberg)
    url: https://multicast.aspra.uni-bamberg.de/resources/wowa
    tur: derlem
    diller: [tur, tur-erzurum, aze-iran, qxq]
    kullanim: [agiz, dilbilgisi]
    ne: >-
      Batı Asya'nın az çalışılmış dillerinden açıklamalı konuşma metinleri; Oğuz
      kısmında Ankara, Erzurum, Tebriz, Kaşkay.
    nasil: Her alt veri seti ayrı indirilir (metadata PDF, metin); tüm derlem DOI 10.48564/unibafd-gyws0-g4218.
    erisim: acik
    bicim: csv
    guven: yuksek
    durum: arandi

  # ================================================== TARİHÎ METİNLER

  - kimlik: turik-bitig
    ad: Türik Bitig — Eski Türkçe yazıtlar ve metinler portalı
    url: https://bitig.kz/?lang=e
    tur: tarihi
    diller: [otk]
