# Türk dilleri ağacı
# ------------------------------------------------------------------
# Düğüm alanları:
#   ad, kod     : ad ve benzersiz kod. Dil kodları ISO 639-3 (yoksa kısa bir ad),
#                 ağız kodları "<dil>-<ağız>" biçimindedir.
#   tip         : kol  -> ana kol (anlaşılırlık raporunda ayrı gösterilir)
#                 dil  -> altında ağızları olan bir dil
#                 (Altında ağız olmayan yapraklar da dildir; dilin altındaki
#                  her şey ağızdır.)
#   not         : sınıflandırması tartışmalı yerler
#   konusur     : (sadece diller) yaklaşık anadili konuşur sayısı (Hedef 1 ve 3)
#   konusur_not : sayı belirsizse açıklama
#   agirlik_carpani : istisnai elle düzeltme (gerekçesi yazılmalı)
#
# Bu dosya SOY AĞACIDIR: dillerin nereden geldiğini gösterir ve Hedef 2'nin
# (kök yaşı) temelidir. Diller arasındaki öteki bağlar (anlaşılırlık, temas)
# ag.yaml'dadır. Hedef 1 ve 3 dilleri o bağlarla ve konuşur sayılarıyla tartar;
# orada ağacın şekli ağırlığı etkilemez (ILKELER.md §3).
#   * Ağızları olan her dile otomatik olarak bir "Yazı dili" ağzı eklenir; dilin
#     kendi kodu (ör. tur) o yazı dilini gösterir.

ad: Türk dilleri
kod: turk
alt:
  # ============================================================ OĞUR
  - ad: Oğur kolu
    kod: ogur
    tip: kol
    alt:
      - ad: Çuvaşça
        kod: chv
        konusur: 740_000
        konusur_not: "2021 sayımı ~740 bin (2010'da ~1 milyondu, hızla düşüyor). Kaynak: Wikipedia, Moscow Times."
        tip: dil
        alt:
          - { ad: Viryal (Yukarı) ağzı, kod: chv-viryal }
          - { ad: Anatri (Aşağı) ağzı, kod: chv-anatri }

  - ad: Ortak Türkçe
    kod: ortak
    not: >-
      Türk dillerinin ilk ayrılığı Oğur ile Ortak Türkçe arasındadır. Bu yapı
      Hedef 2'de (kök yaşı) belirleyicidir; Hedef 1 ve 3 dilleri örgüyle
      (ag.yaml) ve konuşur sayılarıyla tartar.
    alt:
      # ========================================================== HALAÇ
      - ad: Halaç kolu
        kod: halac
        tip: kol
        alt:
          - { ad: Halaçça, kod: klj, konusur: 42_000 }

      # ========================================================== OĞUZ
      - ad: Oğuz kolu
        kod: oguz
        tip: kol
        alt:
          - ad: Batı Oğuz
            kod: oguz-bati
            alt:
              - ad: Türkiye-Balkan grubu
                kod: oguz-turkiye
                alt:
                  - ad: Türkiye Türkçesi
                    kod: tur
                    konusur: 80_000_000
                    tip: dil
                    alt:
                      - ad: Anadolu ağızları
                        kod: tur-anadolu
                        alt:
                          - ad: Batı grubu
                            kod: tur-bati
                            alt:
                              - { ad: Ege ağzı, kod: tur-ege }
                              - { ad: Teke-Akdeniz ağzı, kod: tur-teke }
                              - { ad: Orta Anadolu ağzı, kod: tur-orta }
                              - { ad: Batı Karadeniz ağzı (Kastamonu-Sinop), kod: tur-bkaradeniz }
                          - ad: Doğu grubu
                            kod: tur-dogu
                            alt:
                              - { ad: Erzurum-Kars ağzı, kod: tur-erzurum }
                              - { ad: Güneydoğu Anadolu ağzı, kod: tur-guneydogu }
                              - { ad: Ahıska ağzı, kod: tur-ahiska, not: "Ahıska Türklerinin ağzı (Gürcistan kökenli; bugün Kazakistan, Azerbaycan, Türkiye, ABD); Erzurum-Kars ağzına yakın." }
                          - ad: Kuzeydoğu grubu
                            kod: tur-kuzeydogu
                            alt:
                              - { ad: Doğu Karadeniz ağzı (Trabzon-Rize), kod: tur-dkaradeniz }
                      - ad: Rumeli ağızları
                        kod: tur-rumeli
                        alt:
                          - { ad: "Doğu Rumeli ağzı (Bulgaristan, Batı Trakya)", kod: tur-drumeli }
                          - { ad: "Batı Rumeli ağzı (Makedonya, Kosova)", kod: tur-brumeli }
                      - { ad: Kıbrıs ağzı, kod: tur-kibris }
                      - { ad: Suriye Türkmen ağızları, kod: tur-suriye }
                  - ad: Gagavuzca
                    kod: gag
                    konusur: 150_000
                    tip: dil
                    alt:
                      - { ad: Merkez ağzı (Komrat), kod: gag-merkez }
                      - { ad: Güney ağzı (Vulkaneşti), kod: gag-guney }
                  - ad: Balkan Gagavuz Türkçesi
                    kod: bgx
                    konusur: 11_000
                    konusur_not: "Sadece Balkan toplulukları (~4 bin K. Makedonya) ve Surguçlar (~7 bin, Edirne). Ethnologue'un ~460 bini Türkiye'deki Yörükleri de sayar; onlar burada Türkiye Türkçesinin Teke-Akdeniz ağzındadır."
                    not: Bulgaristan, Kuzey Makedonya ve Yunanistan'daki Gacal, Surguç vb. topluluklar.
              - ad: Azerbaycan grubu
                kod: oguz-azerbaycan
                alt:
                  - ad: Azerbaycan Türkçesi
                    kod: aze
                    konusur: 30_000_000
                    tip: dil
                    alt:
                      - ad: Kuzey Azerbaycan ağızları
                        kod: aze-kuzey-az
                        alt:
                          - { ad: "Doğu grubu (Bakü, Şamahı, Kuba)", kod: aze-dogu }
                          - { ad: "Batı grubu (Gence, Kazah, Karabağ)", kod: aze-bati }
                          - { ad: "Kuzey grubu (Şeki, Zakatala)", kod: aze-kuzey }
                          - { ad: "Güney grubu (Nahçıvan, Ordubad, Lenkeran)", kod: aze-guney }
                      - ad: Güney Azerbaycan ağızları (İran)
                        kod: aze-iran-grup
                        alt:
                          - { ad: Tebriz ağzı, kod: aze-iran }
                          - { ad: Afşar ağızları, kod: aze-afsar }
                      - { ad: Karapapak (Terekeme) ağzı, kod: aze-karapapak, not: "Doğu Anadolu ve Gürcistan." }
                  - ad: Irak Türkmencesi (Kerkük)
                    kod: kerkuk
                    konusur: 2_000_000
                    konusur_not: "Etnik nüfus tahminleri 0.5–5 milyon; Ethnologue/Joshua Project dil için ~2.8 milyon, Irak Planlama Bakanlığı (2013) ~3 milyon etnik. Tahminlerin çoğu 1–10 milyon aralığında."
                    not: Azerbaycan Türkçesi ile Türkiye Türkçesi arasında; ayrı ISO kodu yok.
          - ad: Güney Oğuz (İran)
            kod: oguz-guney
            not: Johanson'un Güney Oğuz grubu (Kaşkayca, Afşar, Sonkor, Aynallu). Afşar ağızları şimdilik Azerbaycan Türkçesinin altında.
            alt:
              - { ad: Kaşkayca, kod: qxq, konusur: 950_000 }
          - ad: Doğu Oğuz
            kod: oguz-dogu
            alt:
              - ad: Türkmence
                kod: tuk
                konusur: 7_000_000
                tip: dil
                alt:
                  - { ad: Teke ağzı, kod: tuk-teke }
                  - { ad: Yomut ağzı, kod: tuk-yomut }
                  - { ad: Ersarı ağzı, kod: tuk-ersari }
                  - { ad: Göklen ağzı, kod: tuk-goklen }
                  - { ad: Salır ağzı, kod: tuk-salir }
                  - { ad: Sarık ağzı, kod: tuk-sarik }
                  - { ad: Çovdur ağzı, kod: tuk-covdur }
              - { ad: Horasan Türkçesi, kod: kmz, konusur: 700_000, konusur_not: "Tahminler 400 bin – 960 bin (Doerfer-Hesche 1993: 960 bin; Wikipedia 2015-19: 400-900 bin)." }
          - ad: Salarca
            kod: slr
            konusur: 70_000
            not: Oğuz kolunun bağımsız bir dalı (çoğu Türkolog). Oğuzların Salur boyundan gelir; Karluk, Çağatay ve Kıpçak etkisi güçlü. Johanson'un Uygurcayla gruplaması azınlık görüşüdür.


      # ========================================================== KIPÇAK
