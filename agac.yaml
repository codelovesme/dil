            alt:
              - { ad: "Karluk ağızları (Taşkent, Fergana)", kod: uzb-karluk }
              - { ad: Kıpçak ağızları, kod: uzb-kipcak }
              - { ad: Oğuz ağızları (Harezm), kod: uzb-oguz }
