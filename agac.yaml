                    konusur: 300_000
                    tip: dil
                    alt:
                      - { ad: Karaçay-Baksan-Çegem ağzı, kod: krc-karacay }
                      - { ad: Malkar ağzı, kod: krc-malkar }
          - ad: Kıpçak-Nogay (Aral-Hazar)
            kod: kipcak-nogay
            alt:
              - ad: Kazakça
                kod: kaz
                konusur: 13_000_000
                tip: dil
                alt:
                  - { ad: Kuzeydoğu ağzı, kod: kaz-kuzeydogu }
                  - { ad: Güney ağzı, kod: kaz-guney }
                  - { ad: Batı ağzı, kod: kaz-bati }
              - ad: Karakalpakça
                kod: kaa
                konusur: 600_000
                tip: dil
                alt:
                  - { ad: Kuzeydoğu ağzı, kod: kaa-kuzeydogu }
                  - { ad: Güneybatı ağzı, kod: kaa-guneybati }
