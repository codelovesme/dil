                kod: nog
                konusur: 90_000
                tip: dil
                alt:
                  - { ad: Kara Nogay ağzı, kod: nog-kara }
                  - { ad: Orta Nogay ağzı, kod: nog-orta }
                  - { ad: Ak Nogay ağzı, kod: nog-ak }
                  - { ad: "Astrahan ağzı (Karagaş, Yurt Tatarları)", kod: nog-astrahan }
              - ad: Sibirya Tatarcası
                kod: sty
                konusur: 100_000
                konusur_not: "Yaklaşık 100 bin (Omniglot, Verbix; sayım değil). Sayımda 'Sibirya Tatarı' diyenler ~7-10 bin, çoğu kendini 'Tatar' yazıyor. Sınırda: 100 binin altına düşerse basamak 5 olur."
                tip: dil
                not: "Kıpçak kolunda olduğu kesin, alt grubu tartışmalı: Kıpçak-Nogay (Wikipedia), Tatarcanın doğu lehçesi (Glottolog); Baraba ve Tom ağızları Kırgız-Kıpçak'a yakın. Erdal: Kıpçak ile Sibirya dilleri arasında bir köprü."
                alt:
                  - { ad: Tobol-İrtiş ağzı, kod: sty-tobol }
                  - { ad: Baraba ağzı, kod: sty-baraba }
                  - { ad: Tom ağzı, kod: sty-tom }
          - ad: Kırgız-Kıpçak
            kod: kirgiz-kipcak
            alt:
              - ad: Kırgızca
                kod: kir
                konusur: 5_000_000
                tip: dil
                alt:
                  - { ad: Kuzey ağzı, kod: kir-kuzey }
                  - { ad: Güney ağzı, kod: kir-guney }
              - ad: Güney Altayca
                kod: alt
                konusur: 55_000
                tip: dil
                not: Glottolog ve Johanson'a göre Kıpçak (Kırgız-Kıpçak); bazı eski sınıflandırmalar Sibirya kolunda sayar.
                alt:
                  - { ad: Altay-kiji ağzı, kod: alt-kiji }
                  - { ad: Telengit ağzı, kod: alt-telengit }
                  - { ad: Teleüt ağzı, kod: alt-teleut }

      # ========================================================== KARLUK
